server.port=8085

# ==============================================================================
# DATABASE CONFIGURATION (MySQL)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_data_assistant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================================================
# OPENAI CONFIGURATION
# ==============================================================================
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.timeout.seconds=30

# ==============================================================================
# SQL SAFETY AND SECURITY CONSTRAINTS
# ==============================================================================
sql.security.max-rows=100
sql.security.query-timeout-seconds=10
sql.security.allowed-tables=students,departments,attendance,marks,placements,query_history

# ==============================================================================
# CORS CONFIGURATION
# ==============================================================================
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Logging
logging.level.com.campusassistant=INFO
logging.level.org.springframework.jdbc=INFO
